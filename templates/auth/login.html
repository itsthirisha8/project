{% extends "base.html" %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.75rem;">Welcome Back</h2>
            <p style="color: var(--text-muted);">Please enter your details</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: 0.75rem; text-decoration: none; color: var(--primary-color);">Forgot
                        password?</a>
                </div>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" name="remember" id="remember" style="width: auto;">
                <label for="remember" style="font-size: 0.875rem; cursor: pointer;">Remember for 30 days</label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="font-size: 0.875rem; color: var(--text-muted);">
                Don't have an account? <a href="{{ url_for('auth.signup') }}"
                    style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
